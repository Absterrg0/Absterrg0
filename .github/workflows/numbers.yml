name: Refresh profile assets

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    paths:
      - scripts/build_assets.py
      - .github/workflows/numbers.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the activity panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_assets.py --numbers

      - name: Commit if the numbers moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/numbers.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh activity panel"
            git push
          fi
